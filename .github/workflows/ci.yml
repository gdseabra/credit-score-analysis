name: CI

# Dispara em PRs (qualquer branch) e em pushes diretos ao main
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Job 1: lint + testes unitários
  # ------------------------------------------------------------------
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.api.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.api.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # Job 2: valida que as imagens Docker constroem sem erros
  # Roda apenas depois que os testes passam, e só no push ao main
  # (PRs não precisam buildar — economiza minutos do CI)
  # ------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
